name: Localization

on:
  pull_request:
  push:
    branches:
      - main
      - codex/l10n-pipeline

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install localization test dependencies
        run: python -m pip install -r tests/requirements.txt luaparser==4.2.0
      - name: Rebuild catalog from a clean checkout
        run: |
          python scripts/wc3_l10n.py extract
          python scripts/wc3_l10n.py extract --check
      - name: Generate locale outputs
        run: |
          python scripts/wc3_l10n.py build --locale enUS
          python build_map_lua.py
      - name: Validate translations and generated outputs
        run: |
          python scripts/wc3_l10n.py check --locale enUS
          python scripts/wc3_l10n.py build --locale enUS --check
          python build_map_lua.py --check-only
      - name: Parse generated Lua
        run: python -c "from luaparser import ast; ast.parse(open('map.w3x/war3map.lua', encoding='utf-8').read())"
      - name: Run localization tests
        run: python -m unittest discover -s tests -p "test_wc3_l10n.py" -v
